<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSU Campus Map — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "JetBrains Mono", monospace, system-ui, sans-serif;
      background: #0d1117;
      color: #94a3b8;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { color: #60a5fa; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; margin-bottom: 12px; letter-spacing: -0.02em; }
    p { font-size: 0.875rem; line-height: 1.6; max-width: 340px; }
    .pill {
      display: inline-block;
      margin-top: 32px;
      padding: 10px 24px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 999px;
      color: #93c5fd;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pill:hover { background: rgba(59, 130, 246, 0.25); }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>The MSU Campus Map requires a network connection to load the map tiles. If you've visited before, the building data is cached and will work once tiles load.</p>
  <button class="pill" onclick="window.location.reload()">↻ Try again</button>
</body>
</html>
